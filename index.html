<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance - Login</title>
    <link rel="stylesheet" href="./index/index.css">
</head>

<body>

    <!-- Background Image --> 
<img src="./images/Budget.jpg" alt="Personal Finance Background" class="background-image">     <!-- Dark Overlay --> 
      <div class="overlay">
      </div>

    <div class="container">

        <div class="form-box">

            <h1>Personal Finance</h1>
            <p class="subtitle">Manage your money smarter</p>

            <!-- Login Form -->
            <form id="loginForm">

                <h2>Welcome Back</h2>

                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email">

                <label>Password</label>

                <div class="password-box">
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                    <button type="button" onclick="togglePassword('loginPassword')">
                        Show
                    </button>
                </div>

                <button type="submit" class="main-btn">Login</button>

                <p id="loginMessage"></p>

                <p class="switch">
                    Don't have an account?
                    <a href="#" onclick="showSignup()">Sign Up</a>
                </p>

            </form>


            <!-- Signup Form -->
            <form id="signupForm" class="hidden">

                <h2>Create Account</h2>

                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label>Password</label>

                <div class="password-box">
                    <input type="password" id="password" placeholder="Create a password">
                    <button type="button" onclick="togglePassword('password')">
                        Show
                    </button>
                </div>

                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password">

                <button type="submit" class="main-btn">Create Account</button>

                <p id="signupMessage"></p>

                <p class="switch">
                    Already have an account?
                    <a href="#" onclick="showLogin()">Login</a>
                </p>

            </form>

        </div>

    </div>

    <script src="./index/index.js"></script>


</body>

</html>
