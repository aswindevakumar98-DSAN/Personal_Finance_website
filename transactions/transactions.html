<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFinance - Transactions</title>

    <!--CSS-->
    <link rel="stylesheet" href="transactions.css">

    <!--Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>
    <div class="container">

        <!--SideBar-->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-wallet"></i>
                <span>MyFinance</span>
            </div>
            <nav>
                <a href="#" class=>
                    <i class="fa-solid fa-house"></i>Dashboard
                </a>
                <a href="#" class=>
                    <i class="fa-solid fa-chart-column"></i>Analytics
                </a>
                <a href="#" class="active">
                    <i class="fa-solid fa-right-left" style="color: rgb(255, 255, 255);"></i>Transaction
                </a>
                <a href="#" class=>
                    <i class="fa-solid fa-cart-flatbed" style="color: rgb(255, 255, 255);"></i>Budget
                </a>
                <a href="#" class=>
                    <i class="fa-solid fa-gear"></i>Settings
                </a>
            </nav>

            <div class="profile">
                <div class="profile-circle">J</div>
                <div>
                    <h4>Joys Mary</h4>
                    <p>joys@example.com</p>
                </div>
            </div>
        </aside>

        <!--Main Content-->
        <main class="main">

            <!--Header-->
            <div class="page-header">
                <h1>Transaction</h1>
                <button class="add-btn" onclick="openModal()">
                    <i class="fa-solid fa-plus"></i>Add Transaction
                </button>
            </div>

            <!--Filter-->
            <div class="filter">
                <div class="filters">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Serach by Description...."
                            oninput="filterTransactions()">
                    </div>

                    <select id="categoryFilter" onchange="filterTransaction()">
                        <option value="all">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Income">Income</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Bills">Bills</option>
                    </select>

                    <select id="sortFilter" onchange="sortTransactions()">
                        <option value="date-desc">Sort by Date (Newest)</option>
                        <option value="date-asc">Sort by Date (Oldest)</option>
                        <option value="amount-high">Amount (High to Low)</option>
                        <option value="amount-low">Amount (Low to High)</option>
                    </select>
                </div>

                <!--Taable-->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Type</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="transactionTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>

    <!--Add Transaction Model-->
    <div class="model" id="transactionModel">
        <div class="model-content">
            <div class="model-header">
                <h2 id="modelTitle">Add Transaction</h2>
                <button onclick="closeModal()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="transactionForm">
                <label>Delete</label>
                <input type="date" id="date" required>

                <label>Description</label>
                <input type="text" id="description" placeholder="Enter Your Description" required>

                <label>Category</label>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Income">Income</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Bills">Bills</option>
                </select>

                <label>Amount</label>
                <input type="number" id="amount" placeholder="Enter Amount" min="1" required>
                <label>Type</label>
                <select id="type" required>
                    <option value="">Select Type</option>
                    <option value="Income">Income</option>
                    <option value="Expense">Expense</option>
                </select>

                <button type="sumbit" class="save-btn">
                    Save Transaction
                </button>
            </form>

        </div>
    </div>

    <!--JavaScript-->
    <script src="transactions.js"></script>

</body>

</html>
